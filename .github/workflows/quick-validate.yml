name: Quick Validate

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  quick-validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test quantum engine
        run: npm run test:engine

      - name: Validate lessons
        run: npm run check:lessons

      - name: Typecheck, lint, and build
        run: npm run check:full
        env:
          NEXT_PUBLIC_SITE_URL: https://qcmlbytarak.web.app
